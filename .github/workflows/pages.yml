name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez, sem cancelar a que ja estiver no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir tipos e lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Liga o Pages no repositorio na primeira execucao.
          enablement: true

      # O site fica em /<repo>/, entao o build precisa gerar caminhos com esse
      # prefixo (ffmpeg.wasm, fontes, etc. sao buscados via caminho absoluto).
      - name: Build (export estatico)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
